<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS遊び場</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #eee; }
  h1 { font-size: 1.4rem; }
  button { padding: .5rem 1rem; margin: .25rem .25rem .25rem 0; cursor: pointer; }
  input { padding: .5rem; width: 6rem; }
  pre { background: #222; padding: 1rem; border-radius: 6px; min-height: 3rem; white-space: pre-wrap; }
  #physBox { height: 280px; margin-top: .5rem; border-radius: 6px; overflow: hidden; }
</style>
</head>
<body>
  <h1>JS遊び場</h1>
  <p id="text">このページの文字で遊ぶ。ボタンを押してみて。</p>

  <button id="reverse">文字を反転</button>
  <button id="color">背景色ランダム</button>

  <h2>is-even を試す</h2>
  <input id="num" type="number" value="4">
  <button id="check">偶数?</button>
  <pre id="out">ここに結果が出る</pre>

  <h2>sillyname</h2>
  <button id="silly">変な名前を作る</button>
  <pre id="sillyOut">ここに名前が出る</pre>

  <h2>cowsay</h2>
  <input id="cowText" type="text" value="moo" style="width:12rem">
  <button id="cow">牛にしゃべらせる</button>
  <pre id="cowOut">ここに牛が出る</pre>

  <h2>JSFuck(JScrewIt)</h2>
  <input id="fuckText" type="text" value="hi" style="width:12rem">
  <button id="fuck">変換</button>
  <pre id="fuckOut">ここに結果が出る</pre>

  <h2>派手なやつ</h2>
  <button id="confetti">canvas-confetti: 紙吹雪</button>
  <button id="party">party.js: ボタンから紙吹雪</button>
  <button id="fw">tsParticles: 花火(8秒)</button>
  <button id="clippy">clippyjs: Clippyを呼ぶ</button>
  <button id="neko">oneko.js: 猫を呼ぶ</button>
  <button id="phys">Matter.js: 物を降らせる</button>
  <pre id="flashyMsg">エラーが出たらここに表示される</pre>
  <div id="physBox"></div>

  <h2>変なやつ</h2>
  <button id="fairy">cursor-effects: 妖精の粉</button>
  <button id="ghost">cursor-effects: 幽霊</button>
  <button id="emojiCur">cursor-effects: 絵文字</button>
  <button id="rainbow">Cursorly.js: 虹の軌跡</button>
  <button id="snap">Thanos: 下の枠を消す</button>
  <button id="fart">fartscroll.js: スクロールで音が出る</button>
  <br>
  <input id="owoText" type="text" value="Hello friend!" style="width:12rem">
  <button id="owo">owoifyx: 変換</button>
  <button id="ipsum">corporate-ipsum: 会社っぽい文章</button>
  <pre id="weirdOut">ここに結果が出る(Thanosで消える枠もここ)</pre>

  <h2>人気ランキング上位</h2>
  <button id="swp">swiper: キューブ回転</button>
  <button id="slk">slick: スライダー</button>
  <button id="gs">gsap: 全部が暴れる</button>
  <button id="bs">bootstrap: 見た目を変える</button>
  <button id="bi">bootstrap-icons: アイコン</button>
  <button id="emo">emoji-datasource-apple: 絵文字</button>
  <button id="hls">hls.js: 動画を流す(無音)</button>
  <br>
  <input id="tex" type="text" value="\int_0^\infty e^{-x^2}\,dx = \frac{\sqrt{\pi}}{2}" style="width:20rem">
  <button id="mj">mathjax: 数式にする</button>
  <div id="topBox"></div>

  <script type="module">
    // CDNから is-even を読み込む(npm installなしで使う方法)
    import isEven from 'https://cdn.jsdelivr.net/npm/is-even/+esm';

    const out = document.getElementById('out');

    document.getElementById('reverse').onclick = () => {
      const t = document.getElementById('text');
      t.textContent = [...t.textContent].reverse().join('');
    };

    document.getElementById('color').onclick = () => {
      document.body.style.background = `hsl(${Math.random() * 360}, 40%, 20%)`;
    };

    document.getElementById('check').onclick = () => {
      const n = Number(document.getElementById('num').value);
      out.textContent = `${n} は ` + (isEven(n) ? '偶数' : '奇数');
    };

    // ここから追加分。ボタンを押した時にだけ読み込むので、失敗しても他のボタンは動く
    const show = (el, text) => { el.textContent = text; };

    document.getElementById('silly').onclick = async () => {
      const el = document.getElementById('sillyOut');
      try {
        const m = await import('https://cdn.jsdelivr.net/npm/sillyname/+esm');
        show(el, m.default());
      } catch (e) { show(el, '失敗: ' + e.message); }
    };

    document.getElementById('cow').onclick = async () => {
      const el = document.getElementById('cowOut');
      try {
        const m = await import('https://cdn.jsdelivr.net/npm/cowsay/+esm');
        const say = m.say || m.default.say;
        show(el, say({ text: document.getElementById('cowText').value }));
      } catch (e) { show(el, '失敗: ' + e.message); }
    };

    // JScrewItは import ではなく、普通の script タグ形式で読み込む
    const loadScript = (src) => new Promise((ok, ng) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = ok;
      s.onerror = () => ng(new Error('読み込み失敗'));
      document.head.appendChild(s);
    });

    document.getElementById('fuck').onclick = async () => {
      const el = document.getElementById('fuckOut');
      try {
        if (!window.JScrewIt) await loadScript('https://cdn.jsdelivr.net/npm/jscrewit');
        const text = document.getElementById('fuckText').value;
        const code = window.JScrewIt.encode(JSON.stringify(text));
        const back = (0, eval)(code);
        show(el, `${code.length}文字になった\n\n${code.slice(0, 300)}...\n\n実行して戻すと: ${back}`);
      } catch (e) { show(el, '失敗: ' + e.message); }
    };

    // ===== 派手なやつ(どれも押した時に初めて読み込む) =====
    const msg = document.getElementById('flashyMsg');
    const logLines = [];
    const fail = (name, e) => {
      logLines.push(`${name} 失敗: ${e.message}`);
      show(msg, logLines.slice(-5).join('\n'));
      console.error(name, e);
    };

    // canvas-confetti: import 方式で読み込む(script タグ方式だと関数が見つからなかった)
    document.getElementById('confetti').onclick = async () => {
      try {
        const m = await import('https://cdn.jsdelivr.net/npm/canvas-confetti/+esm');
        const confetti = typeof m.default === 'function' ? m.default : m.confetti;
        if (typeof confetti !== 'function') throw new Error('中身が想定外: ' + Object.keys(m).join(','));
        confetti({ particleCount: 150, spread: 80, origin: { y: 0.7 } });
      } catch (e) { fail('confetti', e); }
    };

    // party.js: import 方式で読み込む。押したボタンから飛び出す
    document.getElementById('party').onclick = async (ev) => {
      try {
        const m = await import('https://cdn.jsdelivr.net/npm/party-js/+esm');
        const party = (m.default && m.default.confetti) ? m.default : m;
        if (typeof party.confetti !== 'function') throw new Error('中身が想定外: ' + Object.keys(m).join(','));
        party.confetti(ev.currentTarget);
      } catch (e) { fail('party.js', e); }
    };

    // tsParticles fireworks: 夜中なので音はオフ。聞きたければ sounds を true に
    document.getElementById('fw').onclick = async () => {
      try {
        if (!window.fireworks) await loadScript('https://cdn.jsdelivr.net/npm/@tsparticles/fireworks@4/tsparticles.fireworks.bundle.min.js');
        const inst = await window.fireworks({ sounds: false });
        setTimeout(() => {
          try { if (inst.stop) inst.stop(); else if (inst.pause) inst.pause(); } catch (_) {}
        }, 8000);
      } catch (e) { fail('fireworks', e); }
    };

    // clippyjs: モジュール形式で読み込む
    let clippyAgent = null;
    document.getElementById('clippy').onclick = async () => {
      try {
        if (!clippyAgent) {
          const { initAgent } = await import('https://cdn.jsdelivr.net/npm/clippyjs/dist/index.mjs');
          const agents = await import('https://cdn.jsdelivr.net/npm/clippyjs/dist/agents/index.mjs');
          clippyAgent = await initAgent(agents.Clippy);
        }
        clippyAgent.show();
        clippyAgent.speak('コードを書いているようですね。お手伝いしましょうか?');
        clippyAgent.animate();
      } catch (e) { fail('clippyjs', e); }
    };

    // oneko.js: 猫の画像(gif)の場所を data-cat で教える
    let nekoOn = false;
    document.getElementById('neko').onclick = () => {
      if (nekoOn) { show(msg, '猫はもういるよ。マウスを動かしてみて'); return; }
      nekoOn = true;
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/gh/adryd325/oneko.js@main/oneko.js';
      sc.dataset.cat = 'https://cdn.jsdelivr.net/gh/adryd325/oneko.js@main/oneko.gif';
      sc.onerror = () => { nekoOn = false; fail('oneko', new Error('読み込み失敗')); };
      document.head.appendChild(sc);
    };

    // Matter.js: 物理エンジン。押すたびに10個降ってくる。ドラッグで投げられる
    let physEngine = null;
    document.getElementById('phys').onclick = async () => {
      try {
        if (!window.Matter) await loadScript('https://cdn.jsdelivr.net/npm/matter-js/build/matter.min.js');
        const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint } = window.Matter;
        const box = document.getElementById('physBox');
        const w = box.clientWidth, h = box.clientHeight;
        if (!physEngine) {
          physEngine = Engine.create();
          const render = Render.create({ element: box, engine: physEngine, options: { width: w, height: h, wireframes: false, background: '#222' } });
          Composite.add(physEngine.world, [
            Bodies.rectangle(w / 2, h + 25, w, 50, { isStatic: true }),
            Bodies.rectangle(-25, h / 2, 50, h, { isStatic: true }),
            Bodies.rectangle(w + 25, h / 2, 50, h, { isStatic: true }),
          ]);
          const mouse = Mouse.create(render.canvas);
          // マウスホイールを奪われてページがスクロールできなくなるのを防ぐ
          ['wheel', 'mousewheel', 'DOMMouseScroll'].forEach((n) => mouse.element.removeEventListener(n, mouse.mousewheel));
          Composite.add(physEngine.world, MouseConstraint.create(physEngine, { mouse, constraint: { render: { visible: false } } }));
          Render.run(render);
          Runner.run(Runner.create(), physEngine);
        }
        for (let i = 0; i < 10; i++) {
          const x = Math.random() * (w - 60) + 30;
          const opt = { restitution: 0.7, render: { fillStyle: `hsl(${Math.random() * 360}, 70%, 60%)` } };
          const body = Math.random() < 0.5
            ? Bodies.circle(x, -20, 10 + Math.random() * 15, opt)
            : Bodies.rectangle(x, -20, 20 + Math.random() * 30, 20 + Math.random() * 30, opt);
          Composite.add(physEngine.world, body);
        }
      } catch (e) { fail('Matter.js', e); }
    };

    // ===== 変なやつ =====
    const weird = document.getElementById('weirdOut');

    // cursor-effects: カーソルの飾り。1つだけ有効にしたいので、前のを destroy してから作る
    let cursorFx = null;
    const setCursorFx = async (make) => {
      try {
        if (cursorFx && cursorFx.destroy) cursorFx.destroy();
        cursorFx = null;
        const m = await import('https://unpkg.com/cursor-effects@latest/dist/esm.js');
        cursorFx = make(m);
      } catch (e) { fail('cursor-effects', e); }
    };
    document.getElementById('fairy').onclick = () => setCursorFx((m) => new m.fairyDustCursor());
    document.getElementById('ghost').onclick = () => setCursorFx((m) => new m.ghostCursor());
    document.getElementById('emojiCur').onclick = () => setCursorFx((m) => new m.emojiCursor({ emoji: ['🔥', '🐬', '🦆'] }));

    // Cursorly.js: script タグ方式。読み込み後に Cursorly があるか確認する
    document.getElementById('rainbow').onclick = async () => {
      try {
        if (!window.Cursorly) await loadScript('https://cdn.jsdelivr.net/gh/iamashruu/cursorly.js@latest/dist/cursorly.min.js');
        if (!window.Cursorly) throw new Error('読み込んだのに Cursorly が定義されていない');
        window.Cursorly.init({ cursor: 0, effect: { name: 'trail', color: 'rainbow' } });
      } catch (e) { fail('Cursorly.js', e); }
    };

    // Thanos: 下の枠を消して、3秒後に戻す(thanosSnap / thanosRewind)
    document.getElementById('snap').onclick = async () => {
      try {
        const m = await import('https://cdn.jsdelivr.net/npm/@wellwind/thanos-snap/+esm');
        await m.thanosSnap(weird);
        setTimeout(() => m.thanosRewind(weird), 3000);
      } catch (e) { fail('thanos-snap', e); }
    };

    // fartscroll.js: 400px スクロールするごとに音が鳴る。止めるにはページの再読み込み
    document.getElementById('fart').onclick = async () => {
      try {
        if (typeof window.fartscroll !== 'function') await loadScript('https://cdn.jsdelivr.net/gh/theonion/fartscroll.js/fartscroll.js');
        if (typeof window.fartscroll !== 'function') throw new Error('読み込んだのに fartscroll が定義されていない');
        window.fartscroll(400);
        show(weird, 'スクロールしてみて(音が出る)。止めるにはページを再読み込み');
      } catch (e) { fail('fartscroll', e); }
    };

    // owoifyx: 英語を赤ちゃん言葉っぽくする
    document.getElementById('owo').onclick = async () => {
      try {
        const m = await import('https://cdn.jsdelivr.net/npm/owoifyx/+esm');
        const owoify = typeof m.default === 'function' ? m.default : m.owoify;
        if (typeof owoify !== 'function') throw new Error('中身が想定外: ' + Object.keys(m).join(','));
        show(weird, owoify(document.getElementById('owoText').value));
      } catch (e) { fail('owoifyx', e); }
    };

    // corporate-ipsum: 会社っぽい意味のない文章
    document.getElementById('ipsum').onclick = async () => {
      try {
        const m = await import('https://cdn.jsdelivr.net/npm/corporate-ipsum/+esm');
        const createIpsum = typeof m.default === 'function' ? m.default : m.createIpsum;
        if (typeof createIpsum !== 'function') throw new Error('中身が想定外: ' + Object.keys(m).join(','));
        show(weird, createIpsum());
      } catch (e) { fail('corporate-ipsum', e); }
    };

    // ===== 人気ランキング上位 =====
    const topBox = document.getElementById('topBox');
    // 結果を置く箱。同じIDの箱があれば使い回す
    const getBox = (id, style = '') => {
      let el = document.getElementById(id);
      if (!el) {
        el = document.createElement('div');
        el.id = id;
        el.style.cssText = 'margin-top:.75rem;' + style;
        topBox.appendChild(el);
      }
      return el;
    };
    const loadCss = (href) => new Promise((ok, ng) => {
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      l.onload = ok;
      l.onerror = () => ng(new Error('CSS読み込み失敗: ' + href));
      document.head.appendChild(l);
    });
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f'];

    // swiper: 3Dのキューブが回るスライダー
    document.getElementById('swp').onclick = async () => {
      const el = getBox('swpBox');
      try {
        if (el.dataset.ready) return;
        el.dataset.ready = '1';
        await loadCss('https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css');
        if (!window.Swiper) await loadScript('https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js');
        if (!window.Swiper) throw new Error('読み込んだのに Swiper が定義されていない');
        el.innerHTML = '<div class="swiper" style="width:240px;height:240px;margin:0">'
          + '<div class="swiper-wrapper">'
          + colors.map((c, i) => `<div class="swiper-slide" style="background:${c};display:flex;align-items:center;justify-content:center;font-size:4rem;color:#fff">${i + 1}</div>`).join('')
          + '</div><div class="swiper-pagination"></div></div>';
        new window.Swiper(el.firstChild, {
          effect: 'cube',
          loop: true,
          autoplay: { delay: 1500 },
          pagination: { el: el.querySelector('.swiper-pagination'), clickable: true },
        });
      } catch (e) { el.dataset.ready = ''; fail('swiper', e); }
    };

    // slick: jQuery が必要な古い世代のスライダー
    document.getElementById('slk').onclick = async () => {
      const el = getBox('slkBox', 'max-width:420px;');
      try {
        if (el.dataset.ready) return;
        el.dataset.ready = '1';
        await loadCss('https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css');
        await loadCss('https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css');
        if (!window.jQuery) await loadScript('https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js');
        if (!window.jQuery) throw new Error('jQuery が定義されていない');
        if (!window.jQuery.fn.slick) {
          try { await loadScript('https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js'); }
          catch (_) { await loadScript('https://cdn.jsdelivr.net/gh/kenwheeler/slick@1.8.1/slick/slick.min.js'); }
        }
        if (!window.jQuery.fn.slick) throw new Error('読み込んだのに slick が使えない');
        el.innerHTML = colors.map((c, i) => `<div><div style="background:${c};height:140px;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#fff">${i + 1}</div></div>`).join('');
        window.jQuery(el).slick({ dots: true, autoplay: true, autoplaySpeed: 1500 });
      } catch (e) { el.dataset.ready = ''; fail('slick', e); }
    };

    // gsap: ページ上の見出しとボタンを全部ランダムに飛ばして、2秒後に元へ戻す
    document.getElementById('gs').onclick = async () => {
      try {
        if (!window.gsap) await loadScript('https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js');
        if (!window.gsap) throw new Error('読み込んだのに gsap が定義されていない');
        const targets = document.querySelectorAll('button, h1, h2');
        window.gsap.to(targets, {
          x: () => Math.random() * 200 - 100,
          y: () => Math.random() * 100 - 50,
          rotation: () => Math.random() * 60 - 30,
          duration: 0.6, stagger: 0.02, ease: 'elastic.out(1, 0.4)',
        });
        window.gsap.to(targets, { x: 0, y: 0, rotation: 0, duration: 1, delay: 2, stagger: 0.02, ease: 'bounce.out' });
      } catch (e) { fail('gsap', e); }
    };

    // bootstrap: CSSを読み込むと、ページ全体の見た目が変わる(再読み込みで戻る)
    document.getElementById('bs').onclick = async () => {
      try {
        if (document.documentElement.dataset.bs) return;
        document.documentElement.dataset.bs = '1';
        await loadCss('https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css');
        document.documentElement.setAttribute('data-bs-theme', 'dark');
        const kinds = ['btn-primary', 'btn-success', 'btn-danger', 'btn-warning', 'btn-info'];
        document.querySelectorAll('button').forEach((b, i) => b.classList.add('btn', kinds[i % kinds.length], 'm-1'));
        getBox('bsBox').innerHTML = '<div class="alert alert-warning">Bootstrap の見た目になった。再読み込みで戻る</div>';
      } catch (e) { document.documentElement.dataset.bs = ''; fail('bootstrap', e); }
    };

    // bootstrap-icons: クラス名を書くだけでアイコンが出る
    document.getElementById('bi').onclick = async () => {
      try {
        await loadCss('https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css');
        const names = ['heart-fill', 'star-fill', 'bug-fill', 'robot', 'lightning-fill', 'github', 'rocket-takeoff', 'cup-hot-fill'];
        getBox('biBox').innerHTML = names.map((n) => `<i class="bi bi-${n}" title="${n}" style="font-size:2.5rem;margin-right:.75rem"></i>`).join('');
      } catch (e) { fail('bootstrap-icons', e); }
    };

    // emoji-datasource-apple: 絵文字の一覧(JSON)から24個選んで、Appleの絵文字画像を並べる
    let emojiList = null;
    document.getElementById('emo').onclick = async () => {
      const el = getBox('emoBox');
      try {
        if (!emojiList) {
          const res = await fetch('https://cdn.jsdelivr.net/npm/emoji-datasource-apple/emoji.json');
          if (!res.ok) throw new Error('HTTP ' + res.status);
          emojiList = (await res.json()).filter((e) => e.has_img_apple);
        }
        el.innerHTML = '';
        for (let i = 0; i < 24; i++) {
          const e = emojiList[Math.floor(Math.random() * emojiList.length)];
          const img = document.createElement('img');
          img.src = 'https://cdn.jsdelivr.net/npm/emoji-datasource-apple/img/apple/64/' + e.image;
          img.title = e.short_name;
          img.width = 48; img.height = 48;
          img.style.margin = '2px';
          el.appendChild(img);
        }
      } catch (e) { fail('emoji-datasource-apple', e); }
    };

    // hls.js: m3u8(分割された動画)を普通の video タグで再生する。音は消してある
    document.getElementById('hls').onclick = async () => {
      const el = getBox('hlsBox');
      try {
        if (el.dataset.ready) return;
        el.dataset.ready = '1';
        if (!window.Hls) await loadScript('https://cdn.jsdelivr.net/npm/hls.js@latest');
        if (!window.Hls) throw new Error('読み込んだのに Hls が定義されていない');
        const v = document.createElement('video');
        v.controls = true; v.muted = true;
        v.style.cssText = 'width:100%;max-width:480px';
        el.appendChild(v);
        const src = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
        if (window.Hls.isSupported()) {
          const hls = new window.Hls();
          hls.loadSource(src);
          hls.attachMedia(v);
          hls.on(window.Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
        } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
          v.src = src;
          v.play().catch(() => {});
        } else {
          throw new Error('このブラウザはHLS非対応');
        }
      } catch (e) { el.dataset.ready = ''; fail('hls.js', e); }
    };

    // mathjax: 入力欄のTeX記法を、きれいな数式にする
    document.getElementById('mj').onclick = async () => {
      const el = getBox('mjBox', 'font-size:1.6rem');
      try {
        if (!window.MathJax || !window.MathJax.typesetPromise) {
          await loadScript('https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js');
          if (!window.MathJax) throw new Error('読み込んだのに MathJax が定義されていない');
          await window.MathJax.startup.promise;
        }
        el.textContent = '\\[' + document.getElementById('tex').value + '\\]';
        await window.MathJax.typesetPromise([el]);
      } catch (e) { fail('mathjax', e); }
    };
  </script>
</body>
</html>
