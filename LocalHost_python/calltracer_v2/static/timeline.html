<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CallTracer Viewer</title>
<style>
  :root {
    /* ここの値を変えるだけで、対応する色を調整できます */
    --color-return: #4caf50;       /* RETURN行の色 */
    --color-js-source: #f7df1e;    /* JavaScript由来の行の色 */
    --color-note-text: #888;       /* 折り畳み解説文(Supabase解説など)の文字色 */
    --color-note-summary: #666;    /* 折り畳みの見出し(▷部分)の色 */
  }
  body {
    font-family: monospace;
    background: #1e1e1e;
    color: #ddd;
    margin: 0;
    padding: 0;
  }
  #setup {
    padding: 16px;
    background: #2a2a2a;
    border-bottom: 1px solid #444;
  }
  #setup input {
    width: 360px;
    padding: 6px;
    font-family: monospace;
  }
  #setup button {
    padding: 6px 14px;
    margin-left: 6px;
  }
  #status {
    padding: 6px 10px;
    font-size: 13px;
  }
  #status.connected { color: #7CFC00; }
  #status.disconnected { color: #ff6b6b; }
  #status.idle { color: #999; }

  #timeline {
    padding: 8px 10px;
    white-space: pre;
    line-height: 1.5;
  }
  .call { color: #61dafb; }
  .return { color: var(--color-return); }
  .supabase-note summary {
    cursor: pointer;
    color: var(--color-note-summary);
    font-size: 13px;
  }
  .supabase-note summary:hover { color: #999; }
  .supabase-note-body {
    margin-left: 1.5em;
    color: var(--color-note-text);
    white-space: pre-wrap;
  }
  .js-callstack-note summary {
    cursor: pointer;
    color: var(--color-js-source);
    font-size: 13px;
  }
  .js-callstack-note summary:hover { opacity: 0.8; }
  .js-callstack-note-body {
    margin-left: 1.5em;
    color: var(--color-js-source);
    white-space: pre-wrap;
  }
  .depth-indent { color: #555; }
  .source-javascript { color: var(--color-js-source); }
  .error-row { color: #ff6b6b; }
</style>
</head>
<body>

<div id="setup">
  <div id="status" class="idle">未開始</div>
  <div style="margin-top: 8px;">
    <label>
      認証ヘッダーの値(例: <code>Bearer eyJhbGci...</code>)。
      対象アプリの管理者ログインで取得したものをそのまま貼り付けてください。
    </label><br>
    <input id="auth-value" type="text" placeholder="Bearer ...">
    <button id="start-btn">セッション開始</button>
    <button id="stop-btn" disabled>セッション終了</button>
  </div>
  <div style="margin-top: 6px; font-size: 12px; color: #999;">
    ヘッダー名は既定で <code>Authorization</code> です。別の名前を使っている場合は、
    このページを開く前にURLへ <code>?auth_header=X-My-Header</code> を付けてください。
  </div>
  <div id="cross-origin-box" style="margin-top: 10px; display: none;">
    <label>
      対象アプリのURL(フロントエンドがバックエンドと別ドメインの場合、
      最初の1回だけこのリンクから開いてください):
    </label><br>
    <input id="app-url" type="text" placeholder="https://your-frontend.example.com/"
           style="width: 360px;">
    <button id="open-app-btn">セッションID付きで開く</button>
  </div>
</div>

<div id="timeline"></div>

<script>
  const AUTH_STORAGE_KEY = "calltracer_auth_value";
  const SESSION_STORAGE_KEY = "calltracer_session_id";
  const params = new URLSearchParams(location.search);
  const authHeaderName = params.get("auth_header") || "Authorization";

  const statusEl = document.getElementById("status");
  const timelineEl = document.getElementById("timeline");
  const authInput = document.getElementById("auth-value");
  const startBtn = document.getElementById("start-btn");
  const stopBtn = document.getElementById("stop-btn");

  // (ポーリング用タイマーはconnectStream内で宣言済み)

  // 前回入力した認証値を復元しておく(手間を減らすため)
  const savedAuth = localStorage.getItem(AUTH_STORAGE_KEY);
  if (savedAuth) {
    authInput.value = savedAuth;
  }

  startBtn.addEventListener("click", startSession);
  stopBtn.addEventListener("click", stopSession);
  document.getElementById("open-app-btn").addEventListener("click", openAppWithSession);

  // 前回入力した対象アプリURLも復元しておく
  const APP_URL_KEY = "calltracer_app_url";
  const appUrlInput = document.getElementById("app-url");
  const savedAppUrl = localStorage.getItem(APP_URL_KEY);
  if (savedAppUrl) {
    appUrlInput.value = savedAppUrl;
  }

  function openAppWithSession() {
    const sessionId = localStorage.getItem(SESSION_STORAGE_KEY);
    if (!sessionId) {
      alert("先にセッションを開始してください");
      return;
    }
    const appUrl = appUrlInput.value.trim();
    if (!appUrl) {
      alert("対象アプリのURLを入力してください");
      return;
    }
    localStorage.setItem(APP_URL_KEY, appUrl);
    const separator = appUrl.includes("?") ? "&" : "?";
    const url = appUrl + separator + "calltracer_session=" + encodeURIComponent(sessionId);
    window.open(url, "_blank");
  }

  async function startSession() {
    const authValue = authInput.value.trim();
    if (!authValue) {
      alert("認証ヘッダーの値を入力してください");
      return;
    }
    localStorage.setItem(AUTH_STORAGE_KEY, authValue);

    const headers = { "Content-Type": "application/json" };
    headers[authHeaderName] = authValue;

    let res;
    try {
      res = await fetch("/__calltracer__/session/start", {
        method: "POST",
        headers: headers,
      });
    } catch (e) {
      setStatus("disconnected", "通信エラー: " + e);
      return;
    }

    if (!res.ok) {
      setStatus("disconnected", "セッション開始に失敗しました(HTTP " + res.status + ")。認証情報を確認してください。");
      return;
    }

    const data = await res.json();
    const sessionId = data.session_id;
    localStorage.setItem(SESSION_STORAGE_KEY, sessionId);

    startBtn.disabled = true;
    stopBtn.disabled = false;
    authInput.disabled = true;
    document.getElementById("cross-origin-box").style.display = "block";

    connectStream(sessionId);
  }

  async function stopSession() {
    const sessionId = localStorage.getItem(SESSION_STORAGE_KEY);
    const authValue = localStorage.getItem(AUTH_STORAGE_KEY);

    stopPolling();

    if (sessionId && authValue) {
      const headers = { "Content-Type": "application/json" };
      headers[authHeaderName] = authValue;
      try {
        await fetch("/__calltracer__/session/stop", {
          method: "POST",
          headers: headers,
          body: JSON.stringify({ session_id: sessionId }),
        });
      } catch (e) {
        /* 終了通知が失敗しても、ローカルの状態はクリアする */
      }
    }

    localStorage.removeItem(SESSION_STORAGE_KEY);
    startBtn.disabled = false;
    stopBtn.disabled = true;
    authInput.disabled = false;
    setStatus("idle", "終了しました");
  }

  let pollTimer = null;

  function connectStream(sessionId) {
    setStatus("connected", "ポーリング中: /__calltracer__/poll");
    // 注意: 以前はEventSource(SSE)を使っていたが、Gunicornのsyncワーカーが
    // 長時間ブロックする接続を「反応が無い」と誤検知して強制終了してしまう
    // 問題があったため、短い間隔でポーリングする方式に変更した。
    pollTimer = setInterval(function () {
      fetch(
        "/__calltracer__/poll?session_id=" + encodeURIComponent(sessionId)
      )
        .then(function (res) {
          if (!res.ok) {
            throw new Error("poll failed: " + res.status);
          }
          return res.json();
        })
        .then(function (data) {
          setStatus("connected", "ポーリング中: /__calltracer__/poll");
          // 1回のpollで届いた複数イベントを、正しい順番に並べ替える。
          //
          // 単純にtimestampだけで比較すると、JS側(ブラウザの時計)と
          // Python側(Renderサーバーの時計)がズレていて誤った順序になる
          // ことがある。また、因果関係の優先順位(JS→Python→JS)だけで
          // 束ねると、複数の別々の操作(例: 削除操作と、その後の一覧
          // 再読み込み)が同じpoll内に混ざった時に、別々の操作のPython
          // 処理同士が混線して表示されてしまう不具合があった。
          //
          // そこで、JS側が発行するrequest_id(fetch呼び出しごとの共通ID。
          // X-CallTracer-Request-Idヘッダー経由でPython側にも伝わり、
          // CALL/RETURNイベントに同じrequest_idが付与される)を使って、
          // 「同じ操作に属するイベント」を1つのグループとしてまとめる。
          // グループの並び位置は、そのグループのfetch_start(ブラウザの
          // 時計、CLICKと同じ基準)の時刻を「アンカー」として使う。
          // request_idが無いイベント(click単体、request_idの無い古い
          // イベント等)は、自分自身のtimestampをアンカーにする。
          const events = data.events || [];

          const groupAnchor = {};
          events.forEach(function (e) {
            if (e.type === "fetch_start" && e.request_id) {
              groupAnchor[e.request_id] = e.timestamp || 0;
            }
          });

          function anchorOf(e) {
            if (e.request_id && groupAnchor[e.request_id] !== undefined) {
              return groupAnchor[e.request_id];
            }
            return e.timestamp || 0;
          }

          const sorted = events.slice().sort(function (a, b) {
            const anchorDiff = anchorOf(a) - anchorOf(b);
            if (anchorDiff !== 0) return anchorDiff;
            const rankDiff = eventCausalRank(a) - eventCausalRank(b);
            if (rankDiff !== 0) return rankDiff;
            return (a.timestamp || 0) - (b.timestamp || 0);
          });

          sorted.forEach(renderEvent);
        })
        .catch(function () {
          setStatus("disconnected", "ポーリングに失敗しました(再試行します)");
        });
    }, 1000);
  }

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function eventCausalRank(event) {
    // JS(CLICK/CHANGE/SUBMIT/FETCH_START) → Python(CALL/RETURN) →
    // JS(FETCH_END) という、仕組み上絶対に崩れない因果関係の順序を
    // 数値化する。数値が小さいほど先。
    if (event.type === "click" || event.type === "change" || event.type === "submit") return 0;
    if (event.type === "fetch_start") return 1;
    if (event.type === "fetch_end") return 3;
    if (event.type === "adapter_error") return 0; // エラーは早めに出す
    return 2; // Python側のcall/return
  }

  function setStatus(cls, text) {
    statusEl.className = cls;
    statusEl.textContent = text;
  }

  function renderEvent(event) {
    const depth = event.depth || 0;
    const indent = "  ".repeat(Math.max(depth - 1, 0));
    const row = document.createElement("div");

    if (event.type === "adapter_error") {
      row.className = "error-row";
      row.textContent = "[エラー] " + ((event.payload || {}).message || "");
      timelineEl.appendChild(row);
      window.scrollTo(0, document.body.scrollHeight);
      return;
    }

    const isReturnLike = event.type === "return" || event.type === "fetch_end";
    const sourceClass = event.source === "javascript" ? "source-javascript" : "";
    const typeClass = isReturnLike ? "return" : "call";
    const arrow = isReturnLike ? "<-" : "->";
    const label = (event.type || "").toUpperCase();

    const payload = event.payload || {};
    const fn = payload.function || payload.url || payload.target || "(unknown)";

    let extra = "";
    if (event.type === "call") {
      extra = payload.args_summary ? "(" + payload.args_summary + ")" : "";
    } else if (event.type === "fetch_start") {
      extra = payload.method ? " " + payload.method : "";
    } else if (event.type === "fetch_end") {
      extra = payload.status !== undefined ? " status=" + payload.status : "";
    }

    // Python側のCALLイベントには、どのファイルで定義された関数かという
    // 情報(payload.file、フルパス)が付いているので、ファイル名だけを
    // 抜き出して薄く追記する(フルパスは長すぎて読みにくいため)。
    // clickイベントには、代わりにpayload.registered_at
    // (「at 関数名 (URL:行:列)」という形式の1行、addEventListener等が
    // 呼ばれた時点のスタックから採取したもの)からURL部分を抜き出す。
    let fileLabel = "";
    if (event.type === "call" && event.source !== "javascript" && payload.file) {
      const parts = payload.file.split(/[\\/]/); // Windows/Unix両方のパス区切りに対応
      fileLabel = "  [" + parts[parts.length - 1] + "]";
    } else if (
      (event.type === "click" || event.type === "change" || event.type === "submit") &&
      payload.registered_at
    ) {
      const match = payload.registered_at.match(/\(([^)]+)\)/);
      const urlPart = match ? match[1] : payload.registered_at;
      const fileWithLineCol = urlPart.split("/").pop() || urlPart;
      const fileOnly = fileWithLineCol.split(":")[0];
      if (fileOnly) fileLabel = "  [" + fileOnly + "]";
    }

    const time = event.timestamp
      ? new Date(event.timestamp * 1000).toISOString().substr(11, 12)
      : "";

    row.innerHTML =
      '<span class="depth-indent">' + indent + "</span>" +
      '<span class="' + typeClass + " " + sourceClass + '">' +
      arrow + " " + label + " " + escapeHtml(fn) + escapeHtml(extra) +
      "</span>" +
      '<span style="color:#555">' + escapeHtml(fileLabel) + "</span>" +
      '  <span style="color:#666">[' + time + "]</span>";

    timelineEl.appendChild(row);

    // fetch_startに呼び出し経路(Error.stack由来)が付いていれば、
    // 折り畳み表示で挿入する。ボタンクリック等からfetch()に至るまでの
    // 同期的な経路が(追加のJSコード変更なしに)見える。
    if (event.type === "fetch_start" && payload.call_stack) {
      const details = document.createElement("details");
      details.className = "js-callstack-note";
      const summary = document.createElement("summary");
      summary.textContent = "  ".repeat(depth) + "▷ JS呼び出し経路";
      const body = document.createElement("div");
      body.className = "js-callstack-note-body";
      body.textContent = payload.call_stack;
      details.appendChild(summary);
      details.appendChild(body);
      timelineEl.appendChild(details);
    }

    // requests経由でSupabase(PostgREST)へ通信している呼び出しの直後に、
    // 「一般的に何が起きているか」の説明を折り畳み表示で挿入する。
    // 注意: これは今回の実際の処理内容の記録ではなく、Supabase/PostgRESTが
    // 一般的にどう動くかという固定の解説文であることを、表示上も明記する。
    if (
      event.type === "call" &&
      payload.function === "request" &&
      /supabas/i.test(payload.args_summary || "")
    ) {
      const details = document.createElement("details");
      details.className = "supabase-note";
      const summary = document.createElement("summary");
      summary.textContent = "  ".repeat(depth) + "▷ Supabase内部で何が起きているか(一般解説)";
      const body = document.createElement("div");
      body.className = "supabase-note-body";
      body.textContent =
        "        ※ 実際の処理記録ではなく、一般的な仕組みの説明です\n\n" +
        "          リクエストがSupabaseに到着\n" +
        "          ↓\n" +
        "           PostgRESTがURLとHTTPメソッドを解析\n" +
        "           ↓\n" +
        "            対応するSQLを組み立てる\n" +
        "            ↓\n" +
        "             PostgreSQLへSQLを送って実行\n" +
        "             ↓\n" +
        "              実行結果を受け取る\n" +
        "              ↓\n" +
        "               HTTPレスポンスとして組み立てて返す";
      details.appendChild(summary);
      details.appendChild(body);
      timelineEl.appendChild(details);
    }

    // JS(fetch)が絡む1つの操作(FETCH_START〜FETCH_END)の区切りとして、
    // FETCH_ENDの直後に空白行を1行はさむ。これにより、連続する
    // fetch呼び出しがどこからどこまでで1セットかが見た目で分かりやすくなる。
    if (event.type === "fetch_end") {
      const spacer = document.createElement("div");
      spacer.innerHTML = "&nbsp;";
      timelineEl.appendChild(spacer);
    }

    window.scrollTo(0, document.body.scrollHeight);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // ページを離れる時、セッションを自動的に終了させる
  // (Viewerタブを閉じ忘れて本番トレースが有効なまま残るのを防ぐ)
  window.addEventListener("beforeunload", function () {
    const sessionId = localStorage.getItem(SESSION_STORAGE_KEY);
    const authValue = localStorage.getItem(AUTH_STORAGE_KEY);
    if (sessionId && authValue) {
      const headers = {};
      headers[authHeaderName] = authValue;
      navigator.sendBeacon &&
        navigator.sendBeacon(
          "/__calltracer__/session/stop",
          new Blob([JSON.stringify({ session_id: sessionId })], { type: "application/json" })
        );
    }
  });
</script>

</body>
</html>
